name: CI

on:
  push:
    paths-ignore: ['**.md', 'LICENSE', 'logo.png']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE', 'logo.png']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Lint
        run: ./gradlew ktlintCheck

      - name: Test
        run: ./gradlew :jvmTest :jsNodeTest

      # Zipline's QuickJS rejects some JS that Node runs, so the shipped bundle is built too.
      - name: Build
        run: ./gradlew :packageProductionPlugin
