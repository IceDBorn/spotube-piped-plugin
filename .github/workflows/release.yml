name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Tags and full history, so the notes step can diff against the last stable release.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Test
        run: ./gradlew :jvmTest :jsNodeTest

      - name: Build
        run: ./gradlew :generatePluginJson --rerun-tasks :packageProductionPlugin

      - name: Read version
        id: version
        run: echo "version=$(sed -n 's/^pluginVersion=//p' gradle.properties)" >> "$GITHUB_OUTPUT"

      # Commits since the last stable tag; the file keeps commit subjects out of the shell script.
      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prev=$(git describe --tags --abbrev=0 --exclude nightly --exclude "$VERSION" HEAD 2>/dev/null || true)
          git log --no-merges --format='- %s (%h)' ${prev:+$prev..}HEAD > notes.md

      - name: Prepare asset
        run: cp build/distributions/plugin-production.smplug spotube-plugin-piped.smplug

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          body_path: notes.md
          files: spotube-plugin-piped.smplug
          fail_on_unmatched_files: true
