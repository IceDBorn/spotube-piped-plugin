name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # gh workflow run at the end needs this to dispatch the nightly refresh.
      actions: write
    steps:
      # Tags and full history, so the notes step can diff against the last stable release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Read version
        id: version
        run: echo "version=$(sed -n 's/^pluginVersion=//p' gradle.properties)" >> "$GITHUB_OUTPUT"

      # Fails before the build when this version was already released.
      - name: Check tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag $VERSION already exists. Bump pluginVersion first."
            exit 1
          fi

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Test
        run: ./gradlew :jvmTest :jsNodeTest

      - name: Build
        run: ./gradlew :generatePluginJson --rerun-tasks :packageProductionPlugin

      # Commits since the last stable tag; the file keeps commit subjects out of the shell script.
      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/scripts/release-notes.sh stable "$VERSION" > notes.md

      - name: Prepare asset
        run: cp build/distributions/plugin-production.smplug spotube-plugin-piped.smplug

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          body_path: notes.md
          files: spotube-plugin-piped.smplug
          fail_on_unmatched_files: true

      # The bump push already built a nightly against the old stable tag. Rebuild it now
      # that this tag exists, so the nightly body matches what it ships.
      - name: Refresh nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nightly.yml --ref main
